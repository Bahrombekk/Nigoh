# Nigoh CI: lint + testlar + Docker build. PR va main'ga push'da yuradi.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    # Testlar haqiqiy PostgreSQL'da yuradi — prod bilan bir xil versiya.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: nigoh
          POSTGRES_PASSWORD: nigoh
          POSTGRES_DB: nigoh_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nigoh -d nigoh_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://nigoh:nigoh@127.0.0.1:5432/nigoh_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Bog'liqliklar
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Lint (ruff)
        run: ruff check .
      - name: Testlar (pytest)
        run: pytest tests -q

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Docker build
        run: docker build -t nigoh:ci .
