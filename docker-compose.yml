# Nigoh — kamera xaritasi, video devor va media qatlami.
#
# Ishga tushirish (Linux server):
#     cp .env.example .env      # ADMIN_PAROL, PUBLIC_VIEW va boshqalar
#     docker compose up -d --build
#
# WebRTC (jonli video) UDP orqali ishlaydi — shu sababli host tarmog'i
# ishlatiladi: konteyner server portlarini to'g'ridan-to'g'ri egallaydi,
# port map qilish shart emas. Ochiq bo'lishi kerak: 8010, 8888, 8889 (tcp)
# va 8189 (udp). 9997/9998 faqat 127.0.0.1 da — tashqariga ochilmaydi.
services:
  nigoh:
    build: .
    image: nigoh:latest
    container_name: nigoh
    restart: unless-stopped
    # Konteynerda haqiqiy init (tini) turadi va PID 1 bo'ladi.
    #
    # Nima uchun: MediaMTX `runOnDemand` launcher'ini to'xtatganda
    # launcher o'z FFmpeg bolasini yig'ishtirmasdan o'lishi mumkin —
    # bola PID 1 ga o'tadi. PID 1 oddiy dastur bo'lsa (bizda `python
    # main.py`) u begona bolalarni HECH QACHON yig'ishtirmaydi va ular
    # zombi bo'lib to'planadi. Shu serverda qo'shni o'rnatmada aynan
    # shunday bo'lgan: bitta jarayon ostida 1067 ta zombi FFmpeg, eng
    # eskisi 5 kunlik. Har zombi PID bandlaydi — oxiri yangi jarayon
    # ochilmay qoladi, ya'ni kamera ochilmaydi.
    #
    # tini bolalarni yig'ishtiradi va to'xtatish signalini to'g'ri
    # uzatadi. Servisning o'z bolalari (MediaMTX, snapshot FFmpeg'lari)
    # avvalgidek o'zi kutib oladi — bunga tegmaydi.
    init: true
    network_mode: host
    # Baza — hostdagi PostgreSQL (Docker'da EMAS): `apt install postgresql-17`,
    # keyin backend/database/sql/setup-roles.sql (docs/DEPLOY.md). Host tarmog'i
    # tufayli konteyner unga .env dagi DATABASE_URL (127.0.0.1:5432) orqali
    # ulanadi; PostgreSQL tashqi tarmoqqa ochilmaydi.
    env_file:
      - .env
      # IP bo'yicha HTTPS (profil `https`): MEDIA_BASE=/media, WEBRTC_HOSTS ...
      # backend/scripts/docker_https.py --server yaratadi; yo'q bo'lsa e'tiborsiz.
      - path: data/compose.env
        required: false
    volumes:
      # Baza, shifrlash kaliti, loglar — konteyner yangilansa ham qoladi.
      # BU PAPKANI ZAXIRALANG: ichida kamera parollari kaliti bor.
      - ./data:/data
    # NVIDIA GPU — H.265 kameralarni H.264 ga o'girish uchun.
    #
    # GPU berilmasa servis o'zi CPU (`libx264`) ga tushadi va oqim
    # baribir ishlaydi (`media/sync.py:has_nvenc`), lekin bitta H.265
    # kamera bir yadroni to'liq egallaydi. GPU'da o'sha ish deyarli
    # tekin va dekod-kodlash zanjiri xotiraga nusxa olmaydi.
    #
    # Talab: hostda NVIDIA drayveri va nvidia-container-toolkit
    # (`nvidia-ctk --version` javob bersin). Yo'q bo'lsa shu ikki
    # kalitni izohga oling — servis GPU'siz ham ko'tariladi.
    runtime: nvidia
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,video,utility

  # HTTPS (IP bo'yicha, o'z sertifikatimiz) — faqat `https` profilida:
  # .env ga COMPOSE_PROFILES=https yozilsa `docker compose up -d` (va
  # deploy/update.sh) uni o'zi ko'taradi. Konfiguratsiya va sertifikat:
  #   docker compose run --rm --no-deps nigoh python scripts/docker_https.py --server --ip <IP>
  # Host tarmog'ida: MediaMTX HLS/WebRTC portlari proksi rejimida faqat
  # 127.0.0.1 da — nginx ularga shu yerdan yetadi. Yo'riqnoma: docs/SERVER_KOCHIRISH.md
  nginx:
    image: nginx:1.27-alpine
    container_name: nigoh-nginx
    restart: unless-stopped
    profiles: ["https"]
    network_mode: host
    depends_on:
      - nigoh
    volumes:
      - ./data/nginx/nigoh.conf:/etc/nginx/conf.d/default.conf:ro
      - ./data/tls:/etc/nginx/tls:ro
