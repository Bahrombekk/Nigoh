<!doctype html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>NIGOH — video nazorat tizimi</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='12' fill='%232556eb'/%3E%3Cpath d='M9 20s4.2-7.5 11-7.5S31 20 31 20s-4.2 7.5-11 7.5S9 20 9 20Z' fill='none' stroke='%23fff' stroke-width='2.2' stroke-linejoin='round'/%3E%3Ccircle cx='20' cy='20' r='3.4' fill='%23fff'/%3E%3C/svg%3E" />
    <script>
      // Mavzu birinchi chizishdan oldin (miltillamasin) — lib/theme.ts bilan bir xil kalit.
      (function () {
        var t = null;
        try { t = (JSON.parse(localStorage.getItem("nigoh.prefs") || "{}") || {}).theme; } catch (e) {}
        document.documentElement.dataset.theme = /^(white|cream|dark)$/.test(t) ? t : "white";
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
